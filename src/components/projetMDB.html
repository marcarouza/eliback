<!DOCTYPE html>
<html lang="fr">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Card 70/30 Responsive</title>
   <!-- Inclusion de Bootstrap CSS (v5 par exemple) -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
      /* Par défaut, on empile (mobile) */
      .card-70-30 {
         display: flex;
         flex-direction: column;
      }

      /* Sur grand écran, utiliser 70% pour le texte et 30% pour l'image */
      @media (min-width: 992px) {
         .card-70-30 {
            flex-direction: row;
         }

         .card-70-30 .text-column {
            flex: 0 0 70%;
            max-width: 70%;
         }

         .card-70-30 .image-column {
            flex: 0 0 30%;
            max-width: 30%;
         }

         /* Sur grand écran, placer la zone texte à gauche */
         .card-70-30 .text-column {
            order: 1;
         }

         /* et l'image à droite */
         .card-70-30 .image-column {
            order: 2;
         }
      }

      /* Sur mobile, l'image s'affiche au-dessus du texte */
      @media (max-width: 991.98px) {
         .card-70-30 .image-column {
            order: 1;
         }

         .card-70-30 .text-column {
            order: 2;
         }
      }
   </style>
</head>

<body>

   <div class="container my-4">
      <div class="card card-70-30 shadow border-0">
         <!-- Zone image -->
         <div class="image-column">
            <a href="https://exemple.com" target="_blank" rel="noopener noreferrer">
               <img src="https://via.placeholder.com/500x300" class="img-fluid" alt="Description de l'image">
            </a>
         </div>
         <!-- Zone texte -->
         <div class="text-column p-4">
            <a href="https://exemple.com" target="_blank" rel="noopener noreferrer"
               class="text-decoration-none text-dark">
               <h3 class="card-title">Titre avec lien externe</h3>
            </a>
            <p class="card-text">
               Voici le contenu textuel de la carte. Vous pouvez y ajouter des paragraphes, listes, ou tout autre
               élément HTML désiré.
            </p>
         </div>
      </div>
   </div>

   <!-- Inclusion de Bootstrap JS (optionnel) -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
