<!DOCTYPE html>
<html lang="fr">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Compteur de Mots Moderne - Thème Sombre</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="copIstyle.css">
   
</head>

<body>
   <div class="container">
      <div class="card shadow-sm">
         <div class="card-body">
            <h1 class="text-center mb-4">Compteur de Mots</h1>
            <p class="text-center mb-4 text-muted">Analysez rapidement votre texte : comptez les mots, caractères,
               espaces simples, doubles et plus encore !</p>

            <div class="mb-3">
               <textarea class="form-control" id="textInput" rows="7"
                  placeholder="Entrez votre texte ici..."></textarea>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
               <button class="btn btn-primary me-md-2" type="button" onclick="countWords()">Compter</button>
               <button class="btn btn-secondary me-md-2" type="button" onclick="toUpperCase()">TO UPPER CASE</button>
               <button class="btn btn-secondary me-md-2" type="button" onclick="toLowerCase()">TO lower CASE</button>
               <button class="btn btn-danger" type="button" onclick="reset()">Reset</button>
            </div>

            <div class="row mt-4">
               <div class="col-md-4">
                  <div class="stats-card">
                     <h5 class="stats-title text-center">Signes</h5>
                     <p class="stats-value text-center" id="signCount">0</p>
                  </div>
               </div>
               <div class="col-md-4">
                  <div class="stats-card">
                     <h5 class="stats-title text-center">Mots</h5>
                     <p class="stats-value text-center" id="wordCount">0</p>
                  </div>
               </div>
               <div class="col-md-4">
                  <div class="stats-card">
                     <h5 class="stats-title text-center">Espaces Simples</h5>
                     <p class="stats-value text-center" id="singleSpaceCount">0</p>
                  </div>
               </div>
            </div>

            <div class="row mt-4">
               <div class="col-md-6">
                  <div class="stats-card">
                     <h5 class="stats-title text-center">Espaces Doubles</h5>
                     <p class="stats-value text-center" id="doubleSpaceCount">0</p>
                  </div>
               </div>
               <div class="col-md-6">
                  <div class="stats-card">
                     <h5 class="stats-title text-center">Espaces Triples</h5>
                     <p class="stats-value text-center" id="tripleSpaceCount">0</p>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>

   <script>
      function countWords() {
         const text = document.getElementById('textInput').value;
         const signCount = text.length;
         const wordCount = text.trim().split(/\s+/).filter(Boolean).length;
         const singleSpaceCount = (text.match(/ /g) || []).length;
         const doubleSpaceCount = (text.match(/  /g) || []).length;
         const tripleSpaceCount = (text.match(/   /g) || []).length;

         document.getElementById('signCount').innerText = signCount;
         document.getElementById('wordCount').innerText = wordCount;
         document.getElementById('singleSpaceCount').innerText = singleSpaceCount;
         document.getElementById('doubleSpaceCount').innerText = doubleSpaceCount;
         document.getElementById('tripleSpaceCount').innerText = tripleSpaceCount;
      }

      function toUpperCase() {
         const text = document.getElementById('textInput').value.toUpperCase();
         document.getElementById('textInput').value = text;
      }

      function toLowerCase() {
         const text = document.getElementById('textInput').value.toLowerCase();
         document.getElementById('textInput').value = text;
      }

      function reset() {
         document.getElementById('textInput').value = "";
         document.getElementById('signCount').innerText = "0";
         document.getElementById('wordCount').innerText = "0";
         document.getElementById('singleSpaceCount').innerText = "0";
         document.getElementById('doubleSpaceCount').innerText = "0";
         document.getElementById('tripleSpaceCount').innerText = "0";
      }
   </script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
