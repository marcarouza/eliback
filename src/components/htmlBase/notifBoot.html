<!DOCTYPE html>
<html lang="fr">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Notification Bootstrap 5</title>
   <!-- Bootstrap 5 CSS -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
      .notification {
         position: fixed;
         top: 20px;
         right: 20px;
         z-index: 1050;
         transition: opacity 0.5s ease-in-out;
      }
   </style>
</head>

<body>
   <div class="container mt-5">
      <h1>Page de démonstration de notification</h1>
      <button id="showNotification" class="btn btn-primary">Afficher la notification</button>
   </div>

   <div id="notification" class="notification alert alert-success alert-dismissible fade" role="alert"
      style="display: none;">
      <div id="notificationMessage"></div>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
   </div>

   <!-- Bootstrap 5 JS Bundle avec Popper -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
   <script>
      const notification = document.getElementById('notification');
      const notificationMessage = document.getElementById('notificationMessage');
      const showNotificationBtn = document.getElementById('showNotification');

      function showNotification(message, duration = 5000) {
         notificationMessage.textContent = message;
         notification.style.display = 'block';
         setTimeout(() => {
            notification.classList.add('show');
         }, 10);

         if (duration > 0) {
            setTimeout(() => {
               hideNotification();
            }, duration);
         }
      }

      function hideNotification() {
         notification.classList.remove('show');
         setTimeout(() => {
            notification.style.display = 'none';
         }, 500);
      }

      showNotificationBtn.addEventListener('click', () => {
         showNotification('Ceci est une notification de test !');
      });

      // Exemple d'affichage automatique au chargement de la page
      window.addEventListener('load', () => {
         showNotification('Bienvenue sur la page !');
      });
   </script>
</body>

</html>
